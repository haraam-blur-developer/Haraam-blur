name: Build Real Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          # إنشاء مشروع أندرويد حقيقي متكامل بالبنية البرمجية الصحيحة
          mkdir -p app/src/main/java/com/haraan/blur
          mkdir -p app/src/main/res/values

          # نقل كود المالك والخدمة
          cat << 'EOF' > app/src/main/java/com/haraan/blur/MainActivity.kt
          package com.haraan.blur
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Toast.makeText(this, "مرحباً بك يا يوسف - وضع المالك نشط", Toast.LENGTH_LONG).show()
                  startService(Intent(this, HaraanSmartBlurService::class.java))
              }
          }

          class HaraanSmartBlurService : Service() {
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # ملف الماني فست الصلاحيات
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.haraan.blur">
              <application
                  android:allowBackup="true"
                  android:label="Haraan Smart Blur"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".HaraanSmartBlurService" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          rootProject.name = "HaraanBlur"
          EOF

          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.haraan.blur'
              compileSdk 34
              defaultConfig {
                  applicationId "com.haraan.blur"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          ./gradlew assembleDebug

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haraan-Smart-Blur-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
